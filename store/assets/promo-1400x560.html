<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>JSON 工具箱 — 顶部宣传图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .banner { position: relative; width: 1400px; height: 560px; overflow: hidden; color: #fff; background: linear-gradient(115deg, #0d1c4a 0%, #153887 58%, #246bfd 100%); }
    .ring { position: absolute; width: 760px; height: 760px; border: 1px solid #7aa9ff33; border-radius: 50%; right: -140px; top: -315px; }
    .ring.outer { width: 1040px; height: 1040px; right: -280px; top: -455px; }
    .intro { position: absolute; left: 80px; top: 76px; }
    .brand { display: flex; align-items: center; gap: 23px; margin-bottom: 34px; }
    .brand img { width: 84px; height: 84px; border-radius: 21px; box-shadow: 0 12px 30px #00164855; }
    .wordmark { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
    h1 { margin: 0 0 21px; font-size: 68px; line-height: 1.15; font-weight: 600; letter-spacing: 1px; }
    .features { margin: 0 0 22px; color: #c4ddff; font-size: 28px; letter-spacing: 2px; }
    .privacy { margin: 0; color: #b6d2ff; font-size: 20px; letter-spacing: 1px; }
    .tag { display: flex; align-items: center; gap: 18px; margin-top: 45px; font-size: 13px; letter-spacing: 3.2px; color: #b8d2ff; }
    .tag::before { content: ""; width: 46px; height: 3px; background: #83d3ff; border-radius: 3px; }
    .editor { position: absolute; left: 735px; top: 87px; width: 585px; height: 386px; border: 1px solid #a8c9ff55; border-radius: 19px; overflow: hidden; background: #071839df; box-shadow: 0 28px 70px #07153966; }
    .toolbar { height: 53px; display: flex; align-items: center; justify-content: space-between; padding: 0 23px; border-bottom: 1px solid #749fff33; background: #d2e4ff08; }
    .dots { display: flex; gap: 8px; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: #7493bd; }
    .toolbar-label { color: #a7c3eb; font-size: 12px; letter-spacing: 2px; }
    .panes { display: grid; grid-template-columns: 1fr 1fr; height: 333px; }
    .pane { padding: 24px 23px; }
    .pane + .pane { border-left: 1px solid #749fff33; background: #29599e16; }
    .label { margin-bottom: 18px; font-size: 14px; color: #93beff; letter-spacing: 1px; }
    pre { margin: 0; color: #c7dbfb; font: 16px/1.65 Menlo, Monaco, Consolas, monospace; white-space: pre-wrap; }
    .key { color: #91c7ff; }
    .string { color: #a9deb6; }
    .number { color: #f4c989; }
    .boolean { color: #c1adff; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="ring"></div><div class="ring outer"></div>
    <div class="intro">
      <div class="brand"><img src="icon-128.png" alt="JSON 工具箱图标"><span class="wordmark">JSON</span></div>
      <h1>JSON 工具箱</h1>
      <p class="features">格式化 · 对比 · 转换</p>
      <p class="privacy">数据在浏览器本地处理</p>
      <div class="tag">LOCAL &amp; OFFLINE</div>
    </div>
    <div class="editor" aria-label="JSON 格式化示意">
      <div class="toolbar"><div class="dots"><span></span><span></span><span></span></div><span class="toolbar-label">JSON TOOLBOX</span></div>
      <div class="panes">
        <div class="pane"><div class="label">输入 JSON</div><pre>{<span class="key">"name"</span>:<span class="string">"demo"</span>,
<span class="key">"count"</span>:<span class="number">2</span>,<span class="key">"enabled"</span>:
<span class="boolean">true</span>,<span class="key">"tags"</span>:[
<span class="string">"format"</span>,<span class="string">"diff"</span>]}</pre></div>
        <div class="pane"><div class="label">格式化结果</div><pre>{
  <span class="key">"name"</span>: <span class="string">"demo"</span>,
  <span class="key">"count"</span>: <span class="number">2</span>,
  <span class="key">"enabled"</span>: <span class="boolean">true</span>,
  <span class="key">"tags"</span>: [
    <span class="string">"format"</span>,
    <span class="string">"diff"</span>
  ]
}</pre></div>
      </div>
    </div>
  </div>
</body>
</html>
